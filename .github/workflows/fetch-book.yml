name: Fetch book from Kaggle

on:
  workflow_dispatch:
    inputs:
      slug:
        description: Kernel slug from the write-book run, e.g. book-run-123456789
        required: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Kaggle CLI
        run: pip install kaggle

      - name: Status and download
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          SLUG: ${{ inputs.slug }}
        run: |
          kaggle kernels status "$KAGGLE_USERNAME/$SLUG"
          mkdir -p out
          kaggle kernels output "$KAGGLE_USERNAME/$SLUG" -p out
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: book
          path: out
