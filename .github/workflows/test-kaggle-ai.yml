name: Test Kaggle AI (one chapter, no GPU)

on:
  workflow_dispatch:
    inputs:
      model:
        description: Model slug from the Kaggle benchmark model list (see the "List models" step)
        default: gemini-3.8-flash
      title:
        description: Book title
        default: שומרי השקט
      instructions:
        description: Premise, characters, tone (anything the model should follow)
        default: >-
          Science fantasy set in a peaceful futuristic city in the year 2290. Noam, a young
          safety inspector, discovers ancient beings who secretly keep the world at peace,
          even erasing memories to prevent conflict. At first he fights them, believing they
          are harmful; later he reconciles with them on honest terms. The beings are morally
          gray. Small cast, one main city. Thoughtful, tense tone with moments of wonder.
          Suitable for general readers.
      language:
        description: Language of the book
        default: Hebrew
      words:
        description: Target length of the chapter in words
        default: "1500"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Kaggle CLI and benchmarks SDK
        run: pip install -U kaggle kaggle-benchmarks jupytext six

      - name: Build task file
        env:
          INPUT_TITLE: ${{ inputs.title }}
          INPUT_INSTRUCTIONS: ${{ inputs.instructions }}
          INPUT_LANGUAGE: ${{ inputs.language }}
          INPUT_WORDS: ${{ inputs.words }}
        run: python scripts/build_ai_task.py

      - name: List models
        continue-on-error: true
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: kaggle b t models

      - name: Push task
        id: push
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: kaggle b t push story-chapter-test -f ai_task_build/task.py --wait 600

      - name: Run task
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          MODEL: ${{ inputs.model }}
        run: kaggle b t run story-chapter-test -m "$MODEL" --wait 900

      - name: Status
        if: steps.push.outcome == 'success'
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: kaggle b t status story-chapter-test

      - name: Logs (useful when the run failed)
        if: steps.push.outcome == 'success'
        continue-on-error: true
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          MODEL: ${{ inputs.model }}
        run: kaggle b t log story-chapter-test -m "$MODEL"

      - name: Download results
        if: steps.push.outcome == 'success'
        continue-on-error: true
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: kaggle b t download story-chapter-test -o results -f

      - name: Extract chapter
        if: always()
        run: |
          mkdir -p results
          python scripts/extract_chapter.py results

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-chapter-test
          path: results
          if-no-files-found: warn